name: "🔬 Research request"
description: "Ask the Wolfram Scientist to explore a computational/scientific question."
title: "[research] "
labels: ["research-request"]
body:
  - type: input
    id: domain
    attributes:
      label: Domain
      description: e.g. cellular automata, number theory, dynamical systems, graphs
      placeholder: cellular automata
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question / seed
      description: The idea to explore. A good seed is specific enough to be testable but open enough to surprise.
      placeholder: "Among the 256 elementary CA rules, which produce nested (fractal) patterns from a single black cell, and is there a simple predictor of class-4 behavior?"
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: What would make this interesting?
      description: Optional. What kind of result would you find worth reporting?
      placeholder: "A non-obvious classifier, an unexpected outlier, or a clean negative result."
  - type: textarea
    id: data
    attributes:
      label: Data / initial targets
      description: >
        Optional. If this study should run on specific external data (outside
        Wolfram's curated knowledge base), provide it here: paste a small table
        inline, give one or more dataset URLs, or attach a file (drag it onto
        the issue — GitHub turns it into a link). Anything you provide becomes
        the study's PRIMARY dataset; the Scientist caches and SHA-256
        fingerprints it for reproducibility (see lib/data-sources.md and
        lib/dataProvenance.wl). Leave blank for a self-contained computational
        study.
      placeholder: |
        https://earthquake.usgs.gov/fdsnws/event/1/query?format=csv&starttime=2024-01-01&endtime=2024-02-01&minmagnitude=2.5
        (or paste a CSV/table directly, or attach a file)
  - type: input
    id: data_source
    attributes:
      label: Data source
      description: >
        Optional. A whitelist source name (USGS, FRED, World Bank, GBIF,
        Open-Meteo, OpenAlex, openFDA) or "discovery" for an ad-hoc source.
        See lib/data-sources.md.
      placeholder: USGS
  - type: input
    id: budget
    attributes:
      label: Compute budget
      description: Optional. Rough bound so the agent doesn't run away.
      placeholder: "a few minutes of kernel time; search bound <= 10^6"
  - type: markdown
    attributes:
      value: "After filing, comment `@claude` to dispatch the Scientist (if the GitHub Action is enabled), or run `bin/run-research.sh <issue-number>` locally."
